<svg width="1200" height="320" viewBox="0 0 1200 320" xmlns="http://www.w3.org/2000/svg" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="#c9a227" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>

  <rect width="1200" height="320" fill="#14131a"/>

  <text x="600" y="34" font-family="Helvetica, Arial, sans-serif" font-size="20" font-weight="600" fill="#e8e6e1" text-anchor="middle" letter-spacing="3">ADAPTIVE REGEX GENERATION</text>
  <text x="600" y="56" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#8a877e" text-anchor="middle" letter-spacing="1">iterative refinement from labeled examples</text>

  <!-- Box 1 -->
  <rect x="55" y="95" width="250" height="100" rx="6" fill="#1f1e26" stroke="#7a1f2b" stroke-width="1"/>
  <text x="180" y="132" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="600" fill="#e8e6e1" text-anchor="middle">Seed regex</text>
  <text x="180" y="154" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#9a978f" text-anchor="middle">from labeled</text>
  <text x="180" y="170" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#9a978f" text-anchor="middle">pos &amp; neg examples</text>

  <!-- Box 2 -->
  <rect x="335" y="95" width="250" height="100" rx="6" fill="#1f1e26" stroke="#7a1f2b" stroke-width="1"/>
  <text x="460" y="132" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="600" fill="#e8e6e1" text-anchor="middle">Classify dataset</text>
  <text x="460" y="154" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#9a978f" text-anchor="middle">apply current</text>
  <text x="460" y="170" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#9a978f" text-anchor="middle">regex rules</text>

  <!-- Box 3 -->
  <rect x="615" y="95" width="250" height="100" rx="6" fill="#1f1e26" stroke="#7a1f2b" stroke-width="1"/>
  <text x="740" y="132" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="600" fill="#e8e6e1" text-anchor="middle">Review errors</text>
  <text x="740" y="154" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#9a978f" text-anchor="middle">collect false</text>
  <text x="740" y="170" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#9a978f" text-anchor="middle">positives &amp; negatives</text>

  <!-- Box 4 -->
  <rect x="895" y="95" width="250" height="100" rx="6" fill="#1f1e26" stroke="#7a1f2b" stroke-width="1"/>
  <text x="1020" y="132" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="600" fill="#e8e6e1" text-anchor="middle">Regenerate regex</text>
  <text x="1020" y="154" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#9a978f" text-anchor="middle">refine patterns</text>
  <text x="1020" y="170" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#9a978f" text-anchor="middle">from errors</text>

  <!-- Forward arrows -->
  <line x1="305" y1="145" x2="333" y2="145" stroke="#c9a227" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="585" y1="145" x2="613" y2="145" stroke="#c9a227" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="865" y1="145" x2="893" y2="145" stroke="#c9a227" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Loop back arrow (bottom path) -->
  <path d="M1020 195 L1020 225 L460 225 L460 195" fill="none" stroke="#c9a227" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Divider -->
  <line x1="60" y1="248" x2="1140" y2="248" stroke="#3a3840" stroke-width="1"/>

  <!-- Stat callouts -->
  <text x="230" y="282" font-family="Helvetica, Arial, sans-serif" font-size="22" font-weight="600" fill="#c9a227" text-anchor="middle">≤5%</text>
  <text x="230" y="300" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#8a877e" text-anchor="middle">target false-positive threshold</text>

  <text x="600" y="282" font-family="Helvetica, Arial, sans-serif" font-size="22" font-weight="600" fill="#c9a227" text-anchor="middle">~10</text>
  <text x="600" y="300" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#8a877e" text-anchor="middle">typical iterations to converge</text>

  <text x="970" y="282" font-family="Helvetica, Arial, sans-serif" font-size="18" font-weight="600" fill="#c9a227" text-anchor="middle">regex-first</text>
  <text x="970" y="300" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#8a877e" text-anchor="middle">filters before any LLM call</text>
</svg>
